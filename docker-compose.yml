services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taleshift
    ports:
      - "5433:5432"
    volumes:
      - taleshift_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taleshift"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taleshift_db_data:
