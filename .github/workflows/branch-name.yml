name: Branch Name Validation

on:
  push:
    branches-ignore:
      - main

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|refactor|chore|docs|test|perf|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo ""
            echo "Branch names must follow:"
            echo "<type>/<short-description>"
            echo ""
            echo "Allowed types:"
            echo "feature/"
            echo "fix/"
            echo "refactor/"
            echo "chore/"
            echo "docs/"
            echo "test/"
            echo "perf/"
            echo "hotfix/"
            echo ""
            echo "Examples:"
            echo "feature/user-authentication"
            echo "fix/login-validation"
            echo "refactor/api-service"
            exit 1
          fi

          echo "✅ Valid branch name: $BRANCH_NAME"