name: Commit Message Validation

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              echo "range=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
            else
              echo "range=${before}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate commit messages follow Conventional Commits
        env:
          COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: |
          types="feat|fix|refactor|chore|docs|test|perf|hotfix|build|ci|style|revert"
          pattern="^(${types})(\([a-z0-9./_-]+\))?!?: .{1,}"

          if [[ "$COMMIT_RANGE" == *".."* ]]; then
            commits=$(git log --no-merges --format='%H' "$COMMIT_RANGE")
          else
            commits="$COMMIT_RANGE"
          fi

          if [ -z "$commits" ]; then
            echo "No commits to validate."
            exit 0
          fi

          failed=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")

            if [[ ${#subject} -gt 100 ]]; then
              echo "❌ $sha: subject line too long (${#subject} chars, max 100): \"$subject\""
              failed=1
              continue
            fi

            if [[ ! "$subject" =~ $pattern ]]; then
              echo "❌ $sha: \"$subject\""
              echo "   Does not follow Conventional Commits format: <type>(optional-scope): <description>"
              failed=1
            else
              echo "✅ $sha: \"$subject\""
            fi
          done <<< "$commits"

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more commit messages are invalid."
            echo ""
            echo "Expected format:"
            echo "  <type>(optional-scope): <description>"
            echo ""
            echo "Allowed types:"
            echo "  feat, fix, refactor, chore, docs, test, perf, hotfix, build, ci, style, revert"
            echo ""
            echo "Examples:"
            echo "  feat(auth): add login validation"
            echo "  fix: correct rate limit reset on retry"
            echo "  docs(readme): update branching guide"
            exit 1
          fi

          echo "✅ All commit messages are valid."
